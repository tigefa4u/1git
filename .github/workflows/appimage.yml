name: AppImage

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/gpuix/**"
      - ".github/workflows/appimage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  # appimagetool shells out to mksquashfs; squashfs-tools supplies it.
  APPIMAGETOOL_VERSION: "13"

jobs:
  build:
    name: Build 1git.AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d6326836e25ad13d1d33a3c56d1c1e0a34b8f9db # v3
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      # GPUI on Linux links these at build time; the AppImage also bundles the
      # runtime subset so the result runs outside this runner.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang lld cmake pkg-config \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxau-dev libxdmcp-dev \
            libssl-dev libzstd-dev libvulkan1 \
            squashfs-tools

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build JS
        run: bun run build

      - name: Build native addon
        run: bun native/build.ts
        working-directory: apps/gpuix

      # appimagetool is not packaged on the runners; fetch the pinned release.
      - name: Download appimagetool
        run: |
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Assemble AppDir
        run: bun native/package-linux.ts
        working-directory: apps/gpuix

      - name: Build AppImage
        run: appimagetool --no-appstream apps/gpuix/dist/appdir 1git.AppImage

      - uses: actions/upload-artifact@ea165f2f57b7c17d7e7b0d164cd437df1e62bbe6 # v4
        with:
          name: 1git-AppImage
          path: 1git.AppImage
          if-no-files-found: error
