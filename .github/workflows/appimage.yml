name: AppImage

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/gpuix/**"
      - ".github/workflows/appimage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Upstream tags releases `continuous` and `1.9.x`; there is no `13`.
  # appimagetool shells out to mksquashfs; squashfs-tools supplies it.
  APPIMAGETOOL_VERSION: "continuous"

jobs:
  build:
    name: Build 1git.AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      asset: ${{ steps.asset.outputs.asset }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          # Remote helpers are static musl builds, so cross-compiling them needs
          # the musl target; the toolchain ships only the host gnu target.
          rustup target add x86_64-unknown-linux-musl --toolchain 1.97.1
          rustup target add aarch64-unknown-linux-musl --toolchain 1.97.1

      # GPUI on Linux links these at build time; the AppImage also bundles the
      # runtime subset so the result runs outside this runner.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang lld cmake pkg-config \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxau-dev libxdmcp-dev \
            libssl-dev libzstd-dev libvulkan1 \
            squashfs-tools

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build JS
        run: bun run build

      - name: Build native addon
        run: bun native/build.ts
        working-directory: apps/gpuix

      # appimagetool is not packaged on the runners; fetch the pinned release.
      - name: Download appimagetool
        run: |
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Assemble AppDir
        # The remote helper is built from native/remote-helper, which has no
        # rust-toolchain.toml, so it resolves the runner's host toolchain. Pin
        # the same toolchain the native addon uses, otherwise the musl targets
        # installed above are invisible to this build.
        env:
          RUSTUP_TOOLCHAIN: "1.97.1"
        run: bun native/package-linux.ts
        working-directory: apps/gpuix

      # The tag is what makes the version unambiguous, so only tag runs get the
      # release asset name; every other event builds the plain name instead.
      - name: Name the AppImage
        id: asset
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            echo "asset=1git-$version-linux-x86_64.AppImage" >> "$GITHUB_OUTPUT"
          else
            echo "asset=1git.AppImage" >> "$GITHUB_OUTPUT"
          fi

      - name: Build AppImage
        run: appimagetool --no-appstream apps/gpuix/dist/appdir "${{ steps.asset.outputs.asset }}"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: 1git-AppImage
          path: ${{ steps.asset.outputs.asset }}
          if-no-files-found: error

  release:
    name: Publish 1git.AppImage
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: 1git-AppImage
          path: dist

      - name: Attach the AppImage to the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          set -euo pipefail
          test -f "$ASSET"
          sha256sum "$ASSET" >"$ASSET.sha256"

          # Reuse an existing release for the tag, or create one when the tag was
          # pushed without it, so a push from the macOS release path is untouched.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            {
              printf '## Download\n\n'
              printf '[1git for Linux](https://github.com/%s/releases/download/%s/%s)\n\n' \
                "$GITHUB_REPOSITORY" "$TAG" "$ASSET"
              printf 'Requires glibc 2.35 or later, Vulkan 1.1 or later and a Wayland or X11 session.\n\n'
              printf '## Checksum\n\n```\n'
              cat "$ASSET.sha256"
              printf '```\n\n'
              printf 'Built from source commit `%s`.\n' "$GITHUB_SHA"
            } > notes.md

            gh release create "$TAG" --title "1git ${TAG#v}" --notes-file notes.md
          fi

          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
